<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Alchemy</title>
<meta name="description" content="Out for lunch. Andrew Hulin is currently leading design at Slingshot AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: #8a9a8b;
    /* soft plaster-wall texture */
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.10), transparent 55%),
      radial-gradient(ellipse at 75% 80%, rgba(0,0,0,.12), transparent 60%),
      repeating-linear-gradient(115deg, rgba(255,255,255,.02) 0 2px, transparent 2px 5px);
    font-family: "Cormorant Garamond", Georgia, serif;
  }

  .letter {
    position: relative;
    max-width: 460px;
    width: 100%;
    padding: 64px 48px 48px;
    background: #fdfaf2;
    background-image:
      linear-gradient(rgba(112, 96, 60, .035) 1px, transparent 1px);
    background-size: 100% 2.1em;
    color: #3b332a;
    transform: rotate(-2deg);
    box-shadow:
      0 1px 2px rgba(0,0,0,.18),
      0 12px 28px rgba(0,0,0,.28),
      0 30px 60px rgba(0,0,0,.18);
    border-radius: 2px;
  }

  /* slight curl at the bottom corners */
  .letter::after {
    content: "";
    position: absolute;
    left: 12px; right: 12px; bottom: 6px;
    height: 20px;
    z-index: -1;
    box-shadow: 0 14px 14px rgba(0,0,0,.25);
    transform: skewY(-1.5deg);
  }

  .pin {
    position: absolute;
    top: 22px;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ff8a80, #d32f2f 55%, #7f1414);
    box-shadow:
      inset -2px -3px 5px rgba(0,0,0,.35),
      0 6px 8px rgba(0,0,0,.35);
  }
  .pin::after {
    content: "";
    position: absolute;
    top: 26%;
    left: 30%;
    width: 7px;
    height: 6px;
    border-radius: 50%;
    background: rgba(255,255,255,.75);
    filter: blur(1px);
  }

  h1 {
    font-family: "Caveat", cursive;
    font-weight: 600;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1.05;
    margin-bottom: 28px;
    color: #2e2822;
    transform: rotate(-1deg);
  }

  p {
    font-size: 1.25rem;
    line-height: 2.1em;
    margin-bottom: 1em;
  }

  a {
    color: #2e5339;
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  a:hover { color: #1d3a26; }

  .signoff {
    font-family: "Caveat", cursive;
    font-size: 1.7rem;
    margin-top: 36px;
    margin-bottom: 0;
    transform: rotate(-1.5deg);
    color: #2e2822;
  }

  @media (max-width: 480px) {
    .letter { padding: 56px 30px 40px; }
    p { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <main class="letter">
    <span class="pin" aria-hidden="true"></span>
    <h1>Out for lunch.</h1>
    <p>Andrew Hulin is currently leading design at <a href="https://slingshotai.com" rel="noopener">Slingshot&nbsp;AI</a>.</p>
    <p>He can be reached at <a href="mailto:hulinandrew@gmail.com">hulinandrew@gmail.com</a>.</p>
    <p class="signoff">— Good Alchemy</p>
  </main>
</body>
</html>
