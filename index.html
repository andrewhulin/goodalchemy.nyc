<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Good Alchemy</title>
<meta name="description" content="Out for lunch. Andrew Hulin is currently leading design at Slingshot AI.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Rock+Salt&display=swap" rel="stylesheet">
<style>
  :root {
    --stone-50:  #fafaf9;
    --stone-100: #f5f5f4;
    --stone-200: #e7e5e4;
    --stone-300: #d6d3d1;
    --stone-400: #a8a29e;
    --stone-500: #78716c;
    --stone-600: #57534e;
    --stone-700: #44403c;
    --stone-800: #292524;
    --stone-900: #1c1917;
    --stone-950: #0c0a09;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    display: grid;
    place-items: center;
    padding: 24px;
    background-color: var(--stone-400);
    /* plaster wall: stone-200 light pooling top-left, stone-600 shade bottom-right */
    background-image:
      radial-gradient(ellipse at 30% 20%, rgba(231,229,228,.55), transparent 58%),
      radial-gradient(ellipse at 75% 80%, rgba(87,83,78,.40), transparent 62%),
      repeating-linear-gradient(115deg, rgba(250,250,249,.04) 0 2px, transparent 2px 5px);
    font-family: "Cormorant Garamond", Georgia, serif;
  }

  .letter {
    position: relative;
    max-width: 400px;
    width: 100%;
    /* portrait proportions — a page, not a square sticky note */
    min-height: 580px;
    display: flex;
    flex-direction: column;
    padding: 88px 52px 64px;
    color: var(--stone-800);
    transform: rotate(-2deg);
    /* size of the dog-eared corner */
    --fold: 54px;
  }

  /* The sheet itself: paper, ruled lines, aged edges, and the two creases of a
     tri-fold. Its bottom-right corner is clipped away to make room for the
     dog-ear, and it uses drop-shadow rather than box-shadow so the shadow
     follows that clipped silhouette instead of a plain rectangle. */
  .letter::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    border-radius: 1px;
    background-color: var(--stone-200);
    clip-path: polygon(
      0 0,
      100% 0,
      100% calc(100% - var(--fold)),
      calc(100% - var(--fold)) 100%,
      0 100%);
    filter:
      drop-shadow(0 2px 2px rgba(28,25,23,.18))
      drop-shadow(0 14px 26px rgba(28,25,23,.24));
    background-image:
      /* two creases — a dark valley immediately followed by a lit ridge */
      linear-gradient(to bottom,
      rgba(28,25,23,0)    24%,
      rgba(28,25,23,.032) 32.7%,
      rgba(12,10,9,.07)   33.2%,
      rgba(252,252,251,.5) 33.5%,
      rgba(28,25,23,.022) 34.2%,
      rgba(28,25,23,0)    42%,

      rgba(28,25,23,0)    58%,
      rgba(28,25,23,.032) 66.1%,
      rgba(12,10,9,.07)   66.6%,
      rgba(252,252,251,.5) 66.9%,
      rgba(28,25,23,.022) 67.6%,
      rgba(28,25,23,0)    76%),
      /* ruled lines */
      linear-gradient(var(--stone-300) 1px, transparent 1px),
      /* aged warmth pooling toward the edges */
      radial-gradient(ellipse at 50% 42%, rgba(250,250,249,.55) 20%, transparent 62%, rgba(168,162,158,.30) 100%);
    background-size: 100% 100%, 100% 2.1em, 100% 100%;
    background-repeat: no-repeat, repeat, no-repeat;
  }

  /* the corner turned back on itself — the underside of the paper, lit along
     the crease and falling lighter toward the tip */
  .letter::after {
    content: "";
    position: absolute;
    right: 0;
    bottom: 0;
    width: var(--fold);
    height: var(--fold);
    z-index: 0;
    pointer-events: none;
    clip-path: polygon(100% 0, 0 100%, 100% 100%);
    background: linear-gradient(135deg,
      var(--stone-500) 47%,
      var(--stone-400) 56%,
      var(--stone-200) 78%,
      var(--stone-100) 100%);
    filter: drop-shadow(-2px -2px 2.5px rgba(28,25,23,.34));
  }

  /* keep the writing and the pin above the crease shading */
  .letter > * { position: relative; z-index: 1; }
  .pin { z-index: 2; }

  .pin {
    position: absolute;
    top: 22px;
    left: 50%;
    width: 26px;
    height: 26px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #ff8a80, #d32f2f 55%, #7f1414);
    box-shadow:
      inset -2px -3px 5px rgba(12,10,9,.38),
      0 6px 8px rgba(28,25,23,.38);
  }
  .pin::after {
    content: "";
    position: absolute;
    top: 26%;
    left: 30%;
    width: 7px;
    height: 6px;
    border-radius: 50%;
    background: rgba(250,250,249,.7);
    filter: blur(1px);
  }

  h1 {
    font-family: "Caveat", cursive;
    font-weight: 600;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1.05;
    margin-bottom: 28px;
    color: var(--stone-900);
    transform: rotate(-1deg);
  }

  p {
    font-size: 1.25rem;
    line-height: 2.1em;
    margin-bottom: 1em;
    color: var(--stone-700);
  }

  a {
    color: var(--stone-900);
    text-decoration-color: var(--stone-400);
    text-decoration-thickness: 1px;
    text-underline-offset: 3px;
  }
  a:hover { text-decoration-color: var(--stone-700); }

  .signoff {
    font-family: "Rock Salt", cursive;
    /* Rock Salt sets large and dense — smaller than the Caveat it replaced */
    font-size: 1rem;
    line-height: 1.6;
    /* sits at the foot of the page, the way a signature does */
    margin-top: auto;
    padding-top: 40px;
    margin-bottom: 0;
    transform: rotate(-1.5deg);
    color: var(--stone-700);
  }

  @media (max-width: 480px) {
    .letter { padding: 72px 34px 52px; min-height: 520px; }
    p { font-size: 1.15rem; }
  }
</style>
</head>
<body>
  <main class="letter">
    <span class="pin" aria-hidden="true"></span>
    <h1>Out for lunch.</h1>
    <p>Andrew Hulin is currently leading design at <a href="https://slingshotai.com" rel="noopener">Slingshot&nbsp;AI</a>.</p>
    <p>He can be reached at <a href="mailto:hulinandrew@gmail.com">hulinandrew@gmail.com</a>.</p>
    <p class="signoff">— Good Alchemy</p>
  </main>
</body>
</html>
